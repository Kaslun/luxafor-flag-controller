[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon-luxafor"
version = "0.1.0"
description = "Beacon — a local desk-light status bridge for the Luxafor Flag 2"
requires-python = ">=3.11"
dependencies = [
    "hidapi>=0.14",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pystray>=0.19",
    "pillow>=10.0",
    "psutil>=5.9",
    "packaging>=23.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.0",
]

[project.scripts]
beacon = "engine.__main__:main"

[tool.setuptools]
packages = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
