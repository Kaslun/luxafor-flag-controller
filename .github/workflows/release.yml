name: Release

# Tag a release to build and publish the exe:
#   git tag v0.1.0 && git push origin v0.1.0
# Builds beacon.exe and attaches it plus version.json (which the in-app
# updater fetches from the release CDN) to a GitHub Release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install engine (with dev deps)
        # use the setup-python interpreter explicitly so PyInstaller freezes
        # against the same Python whose DLL it bundles (the runner has more
        # than one Python; a mismatch ships an exe that can't load its DLL)
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        # a tagged release must not skip the suite (ci.yml only runs on
        # branch/PR pushes, never on tags)
        run: python -m pytest -q

      - name: Build UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      # bash avoids PowerShell treating PyInstaller's stderr logging as an error
      - name: Generate icon
        shell: bash
        run: python scripts/make_icon.py

      - name: Bundle exe
        shell: bash
        # `python -m PyInstaller` (not bare `pyinstaller`) guarantees it runs
        # under the setup-python interpreter, not some other Python on PATH
        run: python -m PyInstaller packaging/beacon.spec --noconfirm --clean

      - name: Smoke-test the bundled exe
        shell: bash
        # Launch the frozen exe and confirm it actually starts and serves the
        # API. This catches bootloader/DLL-load failures (e.g. a Python
        # version split bundling the wrong pythonXY.dll) that a build-only
        # job would never surface, since CI never ran the exe before.
        run: |
          ./dist/beacon.exe --autostart &
          ok=
          for i in $(seq 1 20); do
            for p in 54741 54742 54743; do
              if curl -s -m 2 "http://127.0.0.1:$p/api/state" >/dev/null; then ok=1; break; fi
            done
            [ -n "$ok" ] && break
            sleep 2
          done
          taskkill //F //IM beacon.exe >/dev/null 2>&1 || true
          if [ -z "$ok" ]; then
            echo "::error::bundled exe did not start — bootloader/DLL failure"
            exit 1
          fi
          echo "smoke OK: exe started and served /api/state"

      - name: Verify version.json matches the tag
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          ver="v$(python -c 'from engine.version import __version__; print(__version__)')"
          if [ "$tag" != "$ver" ]; then
            echo "::error::tag $tag does not match engine version $ver — bump engine/version.py"
            exit 1
          fi

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = "${{ github.ref_name }}".TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$ver" "packaging\beacon.iss"

      - name: Stamp version.json (with download URLs + checksum)
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json
          from engine.version import __version__
          repo = "${{ github.repository }}"
          tag = "${{ github.ref_name }}"
          sha = hashlib.sha256(open("dist/beacon.exe", "rb").read()).hexdigest()
          base = f"https://github.com/{repo}/releases/download/{tag}"
          manifest = {
              "version": __version__,
              "url": f"https://github.com/{repo}/releases",
              "download_url": f"{base}/beacon.exe",
              "setup_url": f"{base}/beacon-setup.exe",
              "sha256": sha,
              "notes": tag,
          }
          with open("dist/version.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          print("wrote dist/version.json", manifest)
          PY

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/beacon.exe
            dist/beacon-setup.exe
            dist/version.json
          generate_release_notes: true
